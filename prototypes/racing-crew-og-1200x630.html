<style>
*{box-sizing:border-box}html,body{width:1200px;height:630px;margin:0;overflow:hidden}body{font-family:"Noto Sans KR",Pretendard,-apple-system,sans-serif;background:#02090f;color:#f8f7f2}.card{position:relative;width:1200px;height:630px;overflow:hidden;background:#061622}.photo{position:absolute;inset:0 0 0 455px;background:url('../images/camp-bg-fleet-race.jpg') 58% 43%/cover no-repeat}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#061622 0%,rgba(6,22,34,.82) 20%,rgba(6,22,34,.12) 65%),linear-gradient(0deg,rgba(2,9,15,.58),transparent 48%)}.shade{position:absolute;inset:0;background:linear-gradient(90deg,#02090f 0,#061622 43%,rgba(6,22,34,.05) 78%)}.slash{position:absolute;top:-80px;right:290px;width:4px;height:810px;background:#e6422e;transform:rotate(17deg);box-shadow:12px 0 0 rgba(230,66,46,.16)}.content{position:absolute;z-index:2;left:68px;top:52px;width:650px}.logo{width:218px;height:auto;display:block;filter:drop-shadow(0 0 1px rgba(255,255,255,.7))}.rule{width:598px;height:1px;margin-top:28px;background:rgba(248,247,242,.22)}.eyebrow{display:inline-flex;align-items:center;height:30px;margin-top:34px;padding:0 13px;border-radius:999px;background:#e6422e;color:#fff;font-size:11px;font-weight:900;letter-spacing:.13em}.boat{margin-top:16px;color:#fff;font-size:22px;font-weight:900;letter-spacing:-.045em}.title{margin-top:4px;font-size:65px;line-height:.98;font-weight:900;letter-spacing:-.075em;text-shadow:0 12px 32px rgba(0,0,0,.45)}.title strong{display:block;color:#ff4d39}.title span{display:block}.lead{margin-top:19px;font-size:19px;font-weight:800;letter-spacing:-.03em}.meta{display:flex;align-items:center;gap:12px;margin-top:32px}.date{padding:12px 17px;border-radius:8px;background:#f8f7f2;color:#e6422e;font-size:19px;font-weight:900}.place{color:#f8f7f2;font-size:16px;font-weight:900}.place small{display:block;margin-bottom:3px;color:#c8a06a;font-size:10px;letter-spacing:.14em}.footer{position:absolute;z-index:2;left:68px;right:68px;bottom:31px;display:flex;align-items:center;justify-content:space-between;padding-top:17px;border-top:2px solid #e6422e;color:rgba(248,247,242,.76);font-size:11px;font-weight:900;letter-spacing:.12em}.footer b{color:#c8a06a;letter-spacing:.08em}
</style>

<body>
<main class="card" role="img" aria-label="아스테리아 슈팅스타 이순신컵 레이싱 크루 모집, 9월 5일·6일·19일·20일 왕산마리나">

    <div class="lead">선수 출신 프로에게 레슨 받을 기회!</div>
    <div class="meta"><div class="date">9월 5 · 6 · 19 · 20일</div><div class="place"><small>WANGSAN MARINA</small>왕산마리나</div></div>
  </section>
  <footer class="footer"><span>ASTERIA YACHT CLUB</span><b>SAIL · TRAIN · RACE</b></footer>
