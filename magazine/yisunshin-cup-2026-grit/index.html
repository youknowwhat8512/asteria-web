<script>
if (!document.querySelector('#articleRoot .article-interview')) {
(() => {
  const article = (window.ASTERIA_ARTICLES || []).find(a => a.slug === document.querySelector('#articleRoot')?.dataset.articleSlug);
  const sections = [...document.querySelectorAll('#articleRoot .article-section')];
  for (const [i, section] of sections.entries()) {
    const firstParagraph = section.querySelector(':scope > p');
    for (const item of article?.sections?.[i]?.bodyMedia || []) {
      const image = [...section.querySelectorAll('figure img')].find(img => img.getAttribute('src') === item.src);
      const figure = image?.closest('figure');
      if (!figure) continue;
      if (item.gallerySolo) figure.dataset.gallerySingle = '';
      if (item.placement === 'section-start' && firstParagraph && figure.parentElement === section) firstParagraph.before(figure);
    }
    const groupable = node => node?.matches('figure.article-section-visual') && !node.hasAttribute('data-gallery-single');
    let node = section.firstElementChild;
    while (node) {
      if (!groupable(node)) { node = node.nextElementSibling; continue; }
      const run = []; let next = node;
      while (groupable(next)) { run.push(next); next = next.nextElementSibling; }
      if (run.length > 1) {
        const group = document.createElement('div'); group.className = 'article-section-gallery gallery-pair'; group.dataset.photoGroup = '';
        run[0].before(group);
        for (const figure of run) { figure.className = 'section-gallery-standard'; group.append(figure); }
      }
      node = next;
    }
  }
})();

}
/* Optional editorial interview. Questions are reconstructed, not a transcript.
 * Enhance only an opted-in section; retain the existing image nodes/anchors. */
(() => {
  const root = document.querySelector('#articleRoot');
  const article = (window.ASTERIA_ARTICLES || []).find(a => a.slug === root?.dataset.articleSlug);
  const element = (tag, className, text) => {
    const node = document.createElement(tag);
    node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  for (const [index, section] of [...(root?.querySelectorAll('.article-section') || [])].entries()) {
    const data = article?.sections?.[index], config = data?.interview;
    if (!config || section.classList.contains('article-interview')) continue;
    const paragraphs = [...section.querySelectorAll(':scope > p')];
    if (paragraphs.length !== config.questions.length) continue;
    const figures = new Map([...section.querySelectorAll('figure')].map(f => [f.querySelector('img')?.getAttribute('src'), f]));
    const header = element('header', 'interview-head');
    const heading = section.querySelector('h3');
    if (!heading) continue;
    heading.id = `article-interview-${index}`;
    header.append(element('div', 'interview-eyebrow', config.eyebrow), heading,
      element('p', 'interview-dek', config.dek), element('p', 'interview-note', config.note));
    const children = [header];
    for (const [i, question] of config.questions.entries()) {
      const exchange = element('div', 'interview-exchange');
      const prompt = element('h4', 'interview-question');
      prompt.append(element('span', 'interview-q', 'Q.'), element('span', 'interview-question-copy', question));
      const answer = element('div', 'interview-answer');
      answer.append(element('span', 'interview-speaker', `A. ${config.respondent}`), paragraphs[i]);
      exchange.append(prompt, answer);
      children.push(exchange);
      for (const media of data.bodyMedia || []) {
        if (media.afterParagraph === i + 1 && figures.has(media.src)) children.push(figures.get(media.src));
      }
    }
    section.classList.add('article-interview');
    section.setAttribute('aria-labelledby', heading.id);
    section.replaceChildren(...children);
  }
})();
</script>
